<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 ネオンテトリス（テスト・確認用）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      background: #090d16;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .standalone-nav {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 2000;
    }
    .btn-back-home {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #475569;
      color: #93c5fd;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    .btn-back-home:hover {
      background: #2563eb;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- ドリルへ戻るリンク -->
  <div class="standalone-nav">
    <a href="../" class="btn-back-home">✏️ 算数ドリルへ</a>
  </div>

  <!-- テトリスゲーム画面モーダル（常時表示） -->
  <div class="modal-overlay tetris-bg" id="tetrisGameModal" style="display: flex;">
    <div class="tetris-container">
      <!-- 上部情報バー -->
      <div class="tetris-header">
        <div class="tetris-timer-box">
          <span class="timer-icon">⏳</span>
          <span class="timer-val" id="tetrisTimer">02:00</span>
        </div>
        <div class="tetris-stats">
          <div class="t-stat">スコア: <span id="tetrisScore">0</span></div>
          <div class="t-stat">ライン: <span id="tetrisLines">0</span></div>
        </div>
        <button class="btn btn-close-game" id="quitTetrisBtn">ドリルへ ✏️</button>
      </div>

      <!-- ゲームメインエリア -->
      <div class="tetris-playfield">
        <div class="canvas-wrap">
          <canvas id="tetrisCanvas" width="200" height="400"></canvas>
          <div class="game-over-overlay" id="gameOverOverlay" style="display: none;">
            <div class="go-text">ゲームオーバー！</div>
            <button class="btn btn-primary" id="retryTetrisBtn">もう一度あそぶ</button>
          </div>
        </div>

        <!-- サイドパネル（HOLD, NEXTミノ & 操作ガイド） -->
        <div class="tetris-side">
          <div class="side-box">
            <div class="side-title">キープ (HOLD)</div>
            <canvas id="holdCanvas" width="70" height="70"></canvas>
          </div>
          <div class="side-box">
            <div class="side-title">つぎのブロック</div>
            <canvas id="nextCanvas" width="70" height="70"></canvas>
          </div>
          <div class="side-box pc-guide">
            <div class="side-title">PC操作</div>
            <p>⬅️ ➡️ : 移動</p>
            <p>⬆️ : 回転</p>
            <p>⬇️ : 下へ</p>
            <p>スペース : 即落下⚡</p>
            <p>C : キープ(HOLD)</p>
          </div>
        </div>
      </div>

      <!-- モバイル・タブレット用コントローラー -->
      <div class="tetris-touch-controls">
        <div class="dpad-left">
          <button class="touch-btn" id="btnLeft">◀</button>
          <button class="touch-btn" id="btnRight">▶</button>
          <button class="touch-btn" id="btnHold">📦 キープ</button>
        </div>
        <div class="dpad-right">
          <button class="touch-btn btn-action" id="btnRotate">🔄 まわす</button>
          <button class="touch-btn btn-action" id="btnDown">⬇️ おとす</button>
          <button class="touch-btn btn-harddrop" id="btnHardDrop">⚡ ドカン！</button>
        </div>
      </div>
    </div>
  </div>

  <!-- タイムアップモーダル -->
  <div class="modal-overlay" id="timeUpModal" style="display: none;">
    <div class="modal-card timeup-card">
      <div class="timeup-icon">⏰ 🎊</div>
      <h2>2分間おつかれさま！</h2>
      <p class="timeup-desc">スコア：<strong id="finalScore">0</strong> 点！<br>もう一度あそぶか、算数ドリルに戻れます。</p>
      <button class="btn btn-primary" id="backToMathBtn">
        <span>🎮 もう一度テトリスであそぶ！</span>
      </button>
      <a href="../" class="btn-text-only" style="margin-top: 8px; text-decoration: none; display: inline-block;">✏️ 算数ドリルへ</a>
    </div>
  </div>

  <script src="../app.js"></script>
  <script>
    // テトリス単体起動スクリプト
    document.addEventListener('DOMContentLoaded', () => {
      let tetrisGameInstance;

      function startStandaloneTetris() {
        tetrisGameInstance = new TetrisGame(() => {
          // 「ドリルへ」を押した時はドリルページへ遷移
          window.location.href = '../';
        });

        // タイムアップ後に「もう一度テトリスであそぶ」を押したときの挙動
        const backBtn = document.getElementById('backToMathBtn');
        if (backBtn) {
          // 既存イベントをクローンして置換
          const newBackBtn = backBtn.cloneNode(true);
          backBtn.parentNode.replaceChild(newBackBtn, backBtn);
          newBackBtn.addEventListener('click', () => {
            document.getElementById('timeUpModal').style.display = 'none';
            tetrisGameInstance.start();
          });
        }

        // 「ドリルへ」ボタンの遷移
        const quitBtn = document.getElementById('quitTetrisBtn');
        if (quitBtn) {
          const newQuitBtn = quitBtn.cloneNode(true);
          quitBtn.parentNode.replaceChild(newQuitBtn, quitBtn);
          newQuitBtn.addEventListener('click', () => {
            tetrisGameInstance.pauseAndSave();
            window.location.href = '../';
          });
        }

        tetrisGameInstance.start();
      }

      startStandaloneTetris();
    });
  </script>
</body>
</html>
